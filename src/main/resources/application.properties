server.port=5000

# Same 16 MB limit as the Python version
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# Gemini settings. The key is NOT stored here.
# Set it with environment variable GEMINI_API_KEY, or in a file named local.properties
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.timeout-seconds=90

# Optional private file next to the project (see local.properties.example)
spring.config.import=optional:file:./local.properties
